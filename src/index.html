<!DOCTYPE html>
	<head>
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<title>Hello, AR Cube!</title>
		<!-- include three.js library -->
		<script src='js/three.js'></script>
		<!-- include jsartookit -->
		<script src="jsartoolkit5/artoolkit.min.js"></script>
		<script src="jsartoolkit5/artoolkit.api.js"></script>
		<!-- include threex.artoolkit -->
		<script src="threex/threex-artoolkitsource.js"></script>
		<script src="threex/threex-artoolkitcontext.js"></script>
		<script src="threex/threex-arbasecontrols.js"></script>
		<script src="threex/threex-armarkercontrols.js"></script>
	</head>

	<body style='margin : 0px; overflow: hidden; font-family: Monospace;'>
		<script>
			var scene, camera, renderer, clock, deltaTime, totalTime;
			var arToolkitSource, arToolkitContext;
			var markerRoot1;
			//figure components
			var innerDodec, middleDodec, outerDodec;
			var torusMeshes = [];
			var orbitParticles = [];
			
			initialize();
			animate();
			
			function initialize(){
				scene = new THREE.Scene();
			
				let ambientLight = new THREE.AmbientLight( 0xffffff, 1.0 );
				scene.add( ambientLight );
			
				let directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
				directionalLight.position.set(1, 2, 3);
				scene.add(directionalLight);
			
				camera = new THREE.Camera();
				scene.add(camera);
			
				renderer = new THREE.WebGLRenderer({
					antialias : true,
					alpha: true
				});
				renderer.setClearColor(new THREE.Color('lightgrey'), 0)
				renderer.setSize( 640, 480 );
				renderer.domElement.style.position = 'absolute'
				renderer.domElement.style.top = '0px'
				renderer.domElement.style.left = '0px'
				document.body.appendChild( renderer.domElement );
			
				clock = new THREE.Clock();
				deltaTime = 0;
				totalTime = 0;
			
				// setup arToolkitSource
			
				arToolkitSource = new THREEx.ArToolkitSource({
					sourceType : 'webcam',
				});
			
				function onResize()
				{
					arToolkitSource.onResize()	
					arToolkitSource.copySizeTo(renderer.domElement)	
					if ( arToolkitContext.arController !== null )
					{
						arToolkitSource.copySizeTo(arToolkitContext.arController.canvas)	
					}	
				}
			
				arToolkitSource.init(function onReady(){
					onResize()
				});
			
				// handle resize event
				window.addEventListener('resize', function(){
					onResize()
				});
			
				// setup arToolkitContext
			
				// create atToolkitContext
				arToolkitContext = new THREEx.ArToolkitContext({
					cameraParametersUrl: 'data/camera_para.dat',
					detectionMode: 'mono'
				});
			
				// copy projection matrix to camera when initialization complete
				arToolkitContext.init( function onCompleted(){
					camera.projectionMatrix.copy( arToolkitContext.getProjectionMatrix() );
				});
			
				// setup markerRoots
			
				// build markerControls
				markerRoot1 = new THREE.Group();
				scene.add(markerRoot1);
				let markerControls1 = new THREEx.ArMarkerControls(arToolkitContext, markerRoot1, {
					type: 'pattern', patternUrl: "data/hiro.patt",
				})
			
				createDodecahedrons();
				createOrbitParticles();
			}
		
			function createDodecahedrons(){
				let innerGeometry = new THREE.DodecahedronGeometry(0.3, 0);
				// Inner figure (smallest, solid, pink, semi-transparent)
				let innerMaterial = new THREE.MeshPhongMaterial({ 
				    color: 0xff66cc,
				    transparent: true,
				    opacity: 0.6,
				    shininess: 100
				});
		
				innerDodec = new THREE.Mesh(innerGeometry, innerMaterial);
				innerDodec.position.y = 2;
				markerRoot1.add(innerDodec);
		
				// Middle figure (medium, wireframe, cyan)
				let middleGeometry = new THREE.DodecahedronGeometry(0.5, 0);
				let middleMaterial = new THREE.MeshBasicMaterial({ 
					color: 0x53EAFD,
					wireframe: true,
					wireframeLinewidth: 2
				});
				middleDodec = new THREE.Mesh(middleGeometry, middleMaterial);
				middleDodec.position.y = 2;
				markerRoot1.add(middleDodec);
			
				// Outer figure (largest, wireframe, blue)
				let outerGeometry = new THREE.DodecahedronGeometry(0.8, 0);
				let outerMaterial = new THREE.MeshBasicMaterial({ 
					color: 0x155DFC ,
					wireframe: true,
					wireframeLinewidth: 2
				});
				outerDodec = new THREE.Mesh(outerGeometry, outerMaterial);
				outerDodec.position.y = 2;
				markerRoot1.add(outerDodec);
			}

			function createOrbitParticles(){
				for(let i = 0; i < 200; i++){		
			    	let size = 0.02 + Math.random() * 0.05;
					let particleGeometry = new THREE.SphereGeometry(size, 12, 12);
			    	let hue = 0.71 + Math.random() * 0.15;
        			let color = new THREE.Color();
        			color.setHSL(hue, 0.8, 0.6);

        			let particleMaterial = new THREE.MeshBasicMaterial({color: color});
				
			        let p = new THREE.Mesh(particleGeometry, particleMaterial);
				
			        p.userData = {
			            angle: Math.random() * Math.PI * 2,
			            radius: 1.2 + Math.random() * 0.4,
			            speed: 0.2 + Math.random()
			        };
				
			        p.position.y = 2 + Math.random() * 0.5;
			        markerRoot1.add(p);
			        orbitParticles.push(p);
			    }
			}
		
			function update(){
				// update artoolkit on every frame
				if (arToolkitSource.ready !== false)
					arToolkitContext.update(arToolkitSource.domElement);
			
				// Rotate figure in different directions and speeds
				if (innerDodec){
					innerDodec.rotation.x += 0.02;
					innerDodec.rotation.y += 0.025;
				}
				if (middleDodec){
					middleDodec.rotation.x -= 0.010;
					middleDodec.rotation.y += 0.002;
				}
				if (outerDodec){
					outerDodec.rotation.x += 0.001;
					outerDodec.rotation.y -= 0.010;
				}

				// Update orbit particles
				for(let i = 0; i < orbitParticles.length; i++){
					let p = orbitParticles[i];
					p.userData.angle += 0.005 * p.userData.speed;
					p.position.x = Math.cos(p.userData.angle) * p.userData.radius;
					p.position.z = Math.sin(p.userData.angle) * p.userData.radius;
				}
			}
		
			function render(){
				renderer.render( scene, camera );
			}
		
			function animate(){
				requestAnimationFrame(animate);
				deltaTime = clock.getDelta();
				totalTime += deltaTime;
				update();
				render();
			}
		</script>
	</body>
</html>
